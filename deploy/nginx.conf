# Пример: статика из dist/, API и сокет — на сервис.
server {
    listen 443 ssl http2;
    server_name shar.example.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    root /var/www/shar/dist;
    client_max_body_size 200m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/javascript text/css text/plain application/manifest+json image/svg+xml application/xml;

    location /api/ws {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /updates/ { alias /var/www/shar/updates/; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /fonts/ { expires 30d; add_header Cache-Control "public"; }
    location /emojis/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
