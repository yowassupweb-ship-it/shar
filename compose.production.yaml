name: shar-next

services:
  api:
    image: ghcr.io/yowassupweb-ship-it/shar-api:${SHAR_IMAGE_TAG:?Set SHAR_IMAGE_TAG to an immutable commit SHA}
    restart: unless-stopped
    init: true
    user: "${SHAR_RUNTIME_UID:?Set SHAR_RUNTIME_UID to the data directory owner UID}:${SHAR_RUNTIME_GID:?Set SHAR_RUNTIME_GID to the data directory owner GID}"
    network_mode: host
    env_file:
      - ${SHAR_ENV_FILE:?Set SHAR_ENV_FILE to the absolute production env file}
    environment:
      SHAR_V2_HOST: 127.0.0.1
      SHAR_V2_PORT: 18100
      SHAR_DATA_DIR: /app/data
      SHAR_UPLOADS_DIR: /app/data/uploads
      SHAR_AUTO_MIGRATE: "0"
      SHAR_STARTUP_MAINTENANCE: "0"
      SHAR_SCHEDULED_JOBS: "${SHAR_SCHEDULED_JOBS:-0}"
      SHAR_MAIL_WATCH: "${SHAR_MAIL_WATCH:-0}"
    volumes:
      - type: bind
        source: ${SHAR_DATA_DIR:?Set SHAR_DATA_DIR to the existing persistent Shar data directory}
        target: /app/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/api/v2/health', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 4

  web:
    image: ghcr.io/yowassupweb-ship-it/shar-web:${SHAR_IMAGE_TAG:?Set SHAR_IMAGE_TAG to an immutable commit SHA}
    restart: unless-stopped
    network_mode: host
    environment:
      SHAR_WEB_LISTEN: 127.0.0.1:18080
      SHAR_API_UPSTREAM: 127.0.0.1:18100
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 4

  migrate:
    image: ghcr.io/yowassupweb-ship-it/shar-api:${SHAR_IMAGE_TAG:?Set SHAR_IMAGE_TAG to an immutable commit SHA}
    profiles: ["maintenance"]
    user: "${SHAR_RUNTIME_UID:?Set SHAR_RUNTIME_UID to the data directory owner UID}:${SHAR_RUNTIME_GID:?Set SHAR_RUNTIME_GID to the data directory owner GID}"
    network_mode: host
    env_file:
      - ${SHAR_ENV_FILE:?Set SHAR_ENV_FILE to the absolute production env file}
    environment:
      SHAR_DATA_DIR: /app/data
      SHAR_UPLOADS_DIR: /app/data/uploads
      SHAR_AUTO_MIGRATE: "0"
    volumes:
      - type: bind
        source: ${SHAR_DATA_DIR:?Set SHAR_DATA_DIR to the existing persistent Shar data directory}
        target: /app/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "app.migrate"]
