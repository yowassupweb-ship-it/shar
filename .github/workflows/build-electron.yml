name: Build Electron (check)

# Проверочная сборка Shar OS — вручную, без публикации. Выпуск делается не отсюда, а по docs/RELEASE.md
# (scripts/publish-electron.ps1): в установщик кладётся тот же dist, что на сервере, latest.yml выкладывается
# последним. Раньше этот workflow сам поднимал версию (не сохраняя её в git) и выкладывал latest.yml вместе с
# установщиком — клиенты могли увидеть новую версию раньше, чем докачался пакет.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build web (dist)
        run: |
          npm ci
          npm run build

      - name: Build Shar OS installer
        working-directory: desktop
        run: |
          npm ci
          npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: shar-os-installer
          path: desktop/release/nsis-web/
          retention-days: 14
