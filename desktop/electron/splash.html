<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shar OS</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
      color: #111111;
      background: transparent;
    }
    .card {
      width: calc(100% - 2px);
      height: calc(100% - 2px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 13px;
      border: 1px solid rgba(15, 23, 42, .10);
      border-radius: 24px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 20px 60px rgba(15, 23, 42, .22), inset 0 1px 0 rgba(255,255,255,.8);
    }
    /* Знак — один кадр, мягко «дышит» (масштаб и свечение), пока приложение грузится. */
    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
            animation: shar-logo-pulse 2200ms ease-in-out infinite;
    }
    @keyframes shar-logo-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none !important; }
    }
    .title { font-size: 19px; line-height: 1; font-weight: 700; letter-spacing: -.02em; }
    .status { min-height: 17px; color: #6b7280; font-size: 12px; }
    .update-progress {
      display: none;
      width: 178px;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(118, 118, 128, .16);
    }
    .update-progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #007aff, #0a84ff);
      transition: width .2s ease;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #fff; }
      .card {
        border-color: rgba(255,255,255,.11);
        background: rgba(44, 44, 46, .98);
        box-shadow: 0 22px 64px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.08);
      }
      .status { color: rgba(255,255,255,.62); }
      .update-progress { background: rgba(255,255,255,.13); }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./splash-logo.png" alt="Shar OS" width="72" height="72">
    <div class="title">Shar OS</div>
    <div class="status">Запуск рабочего пространства…</div>
    <div class="update-progress"><div class="update-progress-fill"></div></div>
  </main>
</body>
</html>
