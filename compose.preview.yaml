name: shar-preview

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    init: true
    user: "33:33"
    network_mode: host
    env_file:
      - ./api.env
    environment:
      SHAR_V2_HOST: 127.0.0.1
      SHAR_V2_PORT: 18100
      SHAR_DATA_DIR: /app/data
      SHAR_UPLOADS_DIR: /app/data/uploads
      SHAR_AUTO_MIGRATE: "0"
      SHAR_STARTUP_MAINTENANCE: "0"
      SHAR_SCHEDULED_JOBS: "0"
      SHAR_MAIL_WATCH: "0"
      SHAR_ENFORCE_AUTH: "1"
      SHAR_LEGACY_ADOPT: "0"
      SHAR_COOKIE_SECURE: "0"
      S3_ENABLED: "0"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/api/v2/health', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: docker/web-runtime.Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      SHAR_WEB_LISTEN: 127.0.0.1:18080
      SHAR_API_UPSTREAM: 127.0.0.1:18100
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
